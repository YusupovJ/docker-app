services:
  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - docker-net
    depends_on:
      - postgres
  api:
    build: 
      target: dev
    volumes:
      - ./api:/app
      - /app/node_modules
  frontend:
    build:
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
